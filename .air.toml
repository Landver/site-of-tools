# Live reload for dev (github.com/air-verse/air). Run via `make dev`.
root = "."
tmp_dir = "tmp"

[build]
  # Also rebuilds the wasm engines (cipher, mail), so their changes reach the browser, not just the API.
  cmd = "go build -o ./tmp/server . && make -s wasm"
  bin = "./tmp/server"
  # Go only: in dev (APP_ENV=dev) templates and static files are re-read per request, so just refresh.
  include_ext = ["go"]
  exclude_dir = ["tmp", "bin", "vendor", "shared/static", "tools/iptools/assets", "docs"]
  exclude_regex = ["_test\\.go"]
  delay = 500
  stop_on_error = true

[misc]
  clean_on_exit = true

services:
  site-of-tools:
    build: .
    container_name: site-of-tools
    restart: unless-stopped
    # The app drains buffered writes on SIGTERM; compose's 10s default can kill it mid-drain.
    stop_grace_period: 30s
    # Bridge gateway, not 0.0.0.0: nginx on another bridge reaches it, the public interface doesn't.
    ports:
      - "172.17.0.1:8080:8080"
    # Later files win: .env.prod holds only the prod overrides. Don't restate values here.
    env_file:
      - .env
      - .env.prod
    volumes:
      # Same repo-relative path as dev: with cwd=/ the .env BIN paths resolve unchanged.
      - ./tools/iptools/assets:/tools/iptools/assets:ro
    # No Mongo volume: it is reached over the network via MONGODB_URI.

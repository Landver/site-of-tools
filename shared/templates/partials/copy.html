{{/* data-copy="<text>" copies on click (data-copy-auto: on swap too); text-only, the label is replaced. */}}
{{define "partials/copy"}}
<script>
  (function () {
    // How long the confirmation stays before the label goes back.
    var RESET_MS = 1600

    // A labelled button never announces its new text, so "Copied" goes to a
    // status line, found by id (Back replaces the body).
    function live() {
      var el = document.getElementById('copy-status')
      if (!el) {
        el = document.createElement('p')
        el.id = 'copy-status'
        el.className = 'sr-only'
        el.setAttribute('role', 'status')
        document.body.appendChild(el)
      }
      return el
    }
    live()

    function flash(el, label, cls) {
      // Remember the real label once per flash cycle, not per call: a second
      // click inside the window would otherwise memorise "Copied" forever.
      if (el._copyTimer) clearTimeout(el._copyTimer)
      else el._copyLabel = el.textContent.trim()
      el.textContent = label
      live().textContent = label
      el.classList.remove('is-copied', 'is-failed')
      el.classList.add(cls)
      el._copyTimer = setTimeout(function () {
        el.textContent = el._copyLabel
        el.classList.remove('is-copied', 'is-failed')
        el._copyTimer = null
      }, RESET_MS)
    }

    function copy(el) {
      var text = el.dataset.copy
      // navigator.clipboard is undefined outside a secure context — reachable
      // in dev over http://192.168.x.x:8080 from a phone. Reading .writeText
      // off it would throw synchronously, before the caller's .catch is
      // attached, and the click would die with nothing shown.
      if (!text || !navigator.clipboard) return Promise.reject(new Error('no clipboard'))
      return navigator.clipboard.writeText(text).then(function () {
        flash(el, 'Copied', 'is-copied')
      })
    }

    document.addEventListener('click', function (e) {
      var el = e.target.closest('[data-copy]')
      if (el) copy(el).catch(function () { flash(el, 'Copy failed', 'is-failed') })
    })

    document.body.addEventListener('htmx:afterSwap', function (e) {
      // A history restore fires afterSwap with no target.
      if (!e.detail.target) return
      var el = e.detail.target.querySelector('[data-copy][data-copy-auto]')
      // Swallowed on purpose: a browser that refuses an unattended write has
      // not failed, it has just left the button to do the job.
      if (el) copy(el).catch(function () {})
    })
  })()
</script>
{{end}}

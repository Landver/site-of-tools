{{define "partials/header"}}
<!-- Global Skip to content link (WCAG 2.4.1) -->
<a href="#main"
   class="sr-only focus:not-sr-only focus:fixed focus:left-4 focus:top-4 focus:z-50 focus:rounded-md focus:bg-canvas focus:px-4 focus:py-2 focus:text-sm focus:font-medium focus:text-strong focus:ring-2 focus:ring-brand focus:shadow-lg">
  Skip to main content
</a>

<header class="border-b border-line sticky top-0 z-30 h-14 bg-canvas/90 backdrop-blur-xs flex items-center">
  <div class="w-full px-4 flex items-center gap-3 sm:px-6">
    <!-- Sidebar toggle (mobile drawer & desktop collapse) -->
    <button type="button"
            id="sidebar-toggle"
            onclick="window.dispatchEvent(new CustomEvent('toggle-sidebar'))"
            aria-label="Toggle navigation sidebar"
            aria-controls="app-sidebar"
            title="Toggle sidebar (Ctrl+B)"
            class="text-muted hover:text-strong p-2 -ml-2 rounded-md hover:bg-surface focus-visible:outline-2 focus-visible:outline-brand transition">
      <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect width="18" height="18" x="3" y="3" rx="2"/>
        <path d="M9 3v18"/>
      </svg>
    </button>

    <!-- Logo always → apex (corpberry.com), even from tool subdomain. -->
    <a href="{{apexURL}}" class="flex min-w-0 items-center gap-2 text-sm font-semibold text-strong hover:text-brand-ink transition">
      <span class="inline-block h-2.5 w-2.5 shrink-0 rounded-full bg-brand"></span>
      <span class="truncate">corpberry.com</span>
    </a>

    <nav aria-label="Site" class="ml-auto flex shrink-0 items-center gap-2 text-sm sm:gap-4">
      <!-- Blog lives on apex only → absolute apex URL, like the logo. -->
      <a href="{{apexURL}}/blog" class="px-2 py-1 text-muted hover:text-strong rounded-md transition">Blog</a>

      <!-- Tools: dropdown of tool catalog (single source: site.Tools). -->
      <div class="relative" x-data="{ open: false }"
           @click.outside="open = false"
           @focusout="if (!$el.contains($event.relatedTarget)) open = false"
           @keydown.escape="if (open) { open = false; $refs.btn.focus() }">
        <button type="button" x-ref="btn" @click="open = !open"
                :aria-expanded="open" aria-controls="tools-menu"
                class="flex items-center gap-1 px-2 py-1 text-muted hover:text-strong rounded-md transition">
          Tools
          <svg class="h-3 w-3 transition-transform" :class="open && 'rotate-180'"
               viewBox="0 0 12 12" fill="none" aria-hidden="true">
            <path d="M3 4.5 6 7.5 9 4.5" stroke="currentColor" stroke-width="1.5"
                  stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <div id="tools-menu" x-show="open" x-cloak x-transition.opacity
             class="absolute right-0 z-10 mt-2 w-56 rounded-lg border border-line bg-surface p-1 shadow-lg">
          {{range navTools}}
          <a href="{{.URL}}"
             class="block rounded-md px-3 py-2 text-muted hover:bg-line hover:text-strong focus:bg-line focus:text-strong focus:outline-none transition">{{.Name}}</a>
          {{else}}
          <span class="block px-3 py-2 text-faint">No tools yet</span>
          {{end}}
        </div>
      </div>

      <!-- Source: site's repo. -->
      <a href="https://github.com/Landver/site-of-tools" target="_blank" rel="noopener"
         aria-label="Source on GitHub (opens in new tab)" class="p-2 text-muted hover:text-strong rounded-md hover:bg-surface transition">
        <svg class="h-5 w-5" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
          <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8z"/>
        </svg>
      </a>

      <!-- Scale toggle: 110% default (comfortable) <-> 100% (compact). Handler set in head. -->
      <button type="button" onclick="toggleScale()"
              x-data="{ compact: window.isScaleCompact ? window.isScaleCompact() : false }"
              @click="compact = !compact"
              :aria-label="compact ? 'Switch to comfortable size (110%)' : 'Switch to compact size (100%)'"
              :title="compact ? 'Scale: Compact 100% (click for 110%)' : 'Scale: Comfortable 110% (click for 100%)'"
              class="p-2 text-muted hover:text-strong rounded-md hover:bg-surface transition flex items-center justify-center">
        <span class="flex items-baseline justify-center w-5 h-5 select-none leading-none tracking-tight font-sans" aria-hidden="true">
          <span class="text-[10px] leading-none transition-opacity" :class="compact ? 'font-bold opacity-100 text-brand-ink' : 'font-normal opacity-50'">a</span><span class="text-[14px] leading-none transition-opacity" :class="compact ? 'font-normal opacity-50' : 'font-bold opacity-100 text-brand-ink'">A</span>
        </span>
      </button>

      <!-- Theme toggle: sun in dark mode, moon in light. Handler set in head. -->
      <button type="button" onclick="toggleTheme()"
              x-data="{ dark: document.documentElement.getAttribute('data-theme') === 'dark' }"
              @click="dark = !dark"
              :aria-label="dark ? 'Switch to light theme' : 'Switch to dark theme'"
              :aria-pressed="dark.toString()"
              class="p-2 text-muted hover:text-strong rounded-md hover:bg-surface transition">
        <svg class="hidden h-5 w-5 dark:block" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
        </svg>
        <svg class="h-5 w-5 dark:hidden" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
        </svg>
      </button>
    </nav>
  </div>
</header>
<div class="flex-1 flex flex-col md:flex-row min-h-0 w-full">
  {{template "partials/sidebar" .}}
  <div class="flex-1 min-w-0 flex flex-col">
{{end}}

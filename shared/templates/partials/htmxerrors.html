{{/* htmx won't swap a non-2xx; swap it only if HTML, since Echo's default error handler answers JSON. */}}
{{define "partials/htmx-errors"}}
<script>
  document.body.addEventListener('htmx:beforeSwap', (e) => {
    const xhr = e.detail.xhr
    if (![400, 401, 404, 409, 429, 500, 502, 503].includes(xhr.status)) return
    const type = xhr.getResponseHeader('content-type') || ''
    if (!type.includes('text/html')) return
    e.detail.shouldSwap = true
    e.detail.isError = false
  })
  document.body.addEventListener('htmx:sendError', (e) => {
    const target = e.detail.target
    if (!target) return
    // Transient: kept out of history (partials/htmx-history).
    target.querySelectorAll(':scope > [data-transient]').forEach((el) => el.remove())
    const box = document.createElement('div')
    box.className = 'alert-error w-full sm:col-span-2'
    box.setAttribute('role', 'alert')
    box.dataset.transient = ''
    box.textContent = "Couldn't reach the server. Check your connection and try again."
    target.prepend(box)
  })
</script>
{{end}}

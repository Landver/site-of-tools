{{/* htmx's history snapshot holds the first-rendered field values, so Back resets them from the URL. */}}
{{define "partials/htmx-history"}}
<script>
  document.body.addEventListener('htmx:historyRestore', () => {
    const params = new URLSearchParams(location.search)
    document.querySelectorAll('main form [name]').forEach((el) => {
      if (params.has(el.name)) el.value = params.get(el.name)
    })
  })
  const pending = new Set()
  document.body.addEventListener('htmx:beforeRequest', (e) => {
    const xhr = e.detail.xhr
    pending.add(xhr)
    xhr.addEventListener('loadend', () => pending.delete(xhr))
  })
  document.body.addEventListener('htmx:historyRestore', () => {
    pending.forEach((xhr) => xhr.abort())
    pending.clear()
  })
  document.body.addEventListener('htmx:beforeHistorySave', () => {
    document.querySelectorAll('[data-transient]').forEach((el) => el.remove())
  })
</script>
{{end}}

{{/* Call with the note slice. The aria-label keeps severity from being color-only (WCAG 1.4.1). */}}
{{define "dns/notes"}}
<ul class="flex flex-col divide-y divide-line text-sm">
  {{range .}}
  <li class="flex items-start gap-3 py-2">
    <span role="img"
          aria-label="{{if eq .Level "fail"}}failing{{else if eq .Level "warn"}}needs improvement{{else if eq .Level "ok"}}good{{else}}note{{end}}"
          class="mt-1.5 inline-block h-2 w-2 shrink-0 rounded-full
          {{if eq .Level "fail"}}bg-danger{{else if eq .Level "warn"}}bg-warn{{else if eq .Level "ok"}}bg-ok{{else}}bg-faint{{end}}"></span>
    <span class="flex-1 min-w-0 {{if eq .Level "fail"}}text-strong{{else}}text-muted{{end}}">{{.Text}}</span>
  </li>
  {{end}}
</ul>
{{end}}

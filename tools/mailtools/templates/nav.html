{{define "mail/nav"}}
<nav aria-label="Mail Tools sections"
     class="mb-6 flex flex-wrap gap-1 rounded-lg border border-line bg-surface p-1 text-sm font-medium sm:mb-8">
  <a href="/dmarc" title="Zero-knowledge DMARC report visualizer"{{if eq .Active "dmarc"}} aria-current="page"{{end}}
     class="rounded-md px-2 py-1.5 transition sm:px-3 {{if eq .Active "dmarc"}}bg-brand text-white{{else}}text-muted hover:text-strong{{end}}">DMARC Visualizer</a>
  <a href="/bimi" title="BIMI SVG Tiny P/S validator and auto-fixer"{{if eq .Active "bimi"}} aria-current="page"{{end}}
     class="rounded-md px-2 py-1.5 transition sm:px-3 {{if eq .Active "bimi"}}bg-brand text-white{{else}}text-muted hover:text-strong{{end}}">BIMI Logo</a>
  <a href="/arc" title="Authenticated Received Chain analyzer"{{if eq .Active "arc"}} aria-current="page"{{end}}
     class="rounded-md px-2 py-1.5 transition sm:px-3 {{if eq .Active "arc"}}bg-brand text-white{{else}}text-muted hover:text-strong{{end}}">ARC Trace</a>
</nav>
<p id="content" class="eyebrow" tabindex="-1">Mail Tools</p>
{{end}}

{{define "mail/skip"}}
<a href="#content"
   class="sr-only focus:not-sr-only focus:fixed focus:left-4 focus:top-4 focus:z-50 focus:rounded-md focus:bg-canvas focus:px-3 focus:py-2 focus:text-sm focus:text-strong focus:ring-2 focus:ring-brand">Skip to the tool</a>
{{end}}
